</style></head><body>
<canvas id="cv"></canvas>
<div id="top"><b>PLANET VEYRA</b><small>A WORLD THAT EVOLVES · CREATOR VIEW</small><span id="clock"></span></div>
<div id="maptools"><button data-map="fit">◎ WORLD VIEW</button><button data-map="plus">＋ ZOOM</button><button data-map="minus">－ ZOOM</button></div>

<script>
"use strict";
/* ============ ENGINE (no DOM; deterministic from S.seed + S.rs; portable to a Worker) ============ */
const W=96,H=64,DAY=48,YEAR=80*DAY,PREG=1900,LX=W*.55,LY=H*.58;
let S,T,BR,WD,ST,BF,RV=[];
function R(){let s=S.rs=(S.rs+0x6D2B79F5)|0,t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function hs(x,y,sd){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(sd|0,1274126177)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295}
function vn(x,y,sd){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=hs(xi,yi,sd),b=hs(xi+1,yi,sd),c=hs(xi,yi+1,sd),d=hs(xi+1,yi+1,sd);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,sd){return(vn(x,y,sd)*.5+vn(x*2,y*2,sd+1)*.25+vn(x*4,y*4,sd+2)*.125+vn(x*8,y*8,sd+3)*.0625)/.9375}
function hh(x,y){const e=Math.abs(x-W/2)/(W/2);return fbm(x*.045,y*.045,S.seed)*.62+e*e*.3+Math.pow(1-y/H,2)*.28+.06-.34*Math.max(0,1-Math.hypot(x-LX,y-LY)/8.5)}
function mo(x,y){return fbm(x*.07+50,y*.07+50,S.seed+7)}
function tt(h,m){return h<.27?0:h<.30?1:h>.76?5:h>.62?4:m>.5?3:2}
function genWorld(){T=new Uint8Array(W*H);BR=new Uint8Array(W*H);WD=new Uint8Array(W*H);ST=new Uint8Array(W*H);BF=new Uint8Array(W*H);const sd=S.seed;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,ty=T[i]=tt(hh(x+.5,y+.5),mo(x+.5,y+.5)),q=hs(x,y,sd+5);
  if(ty==2&&q<.14){BF[i]=1;BR[i]=3}if(ty==3){WD[i]=3+(hs(x,y,sd+6)*5|0);if(q<.1){BF[i]=1;BR[i]=3}}if(ty==4)ST[i]=4;if(ty==2&&hs(x,y,sd+8)<.03)ST[i]=2}
 RV=[];let x=W*.4,y=0;for(let k=0;k<220;k++){RV.push([x,y]);const i=(y|0)*W+(x|0);if(T[i]>=2){T[i]=1;BF[i]=BR[i]=WD[i]=ST[i]=0}const dx=LX-x,dy=LY-y,l=Math.hypot(dx,dy);if(l<6)break;x=Math.max(0,Math.min(W-1,x+dx/l*.9+(hs(k,1,sd)-.5)*.9));y=Math.max(0,Math.min(H-1,y+dy/l*.9+(hs(k,2,sd)-.5)*.5+.1))}}
function pass(x,y){if(x<0||y<0||x>=W||y>=H)return false;const t=T[(y|0)*W+(x|0)];return t>=2&&t<5}
const SY='ka lo mi ra ve tu sa no ri el an da be yo ta su'.split(' ');
function nm(){let s='';for(let i=0,l=2+(R()*2|0);i<l;i++)s+=SY[R()*SY.length|0];return s[0].toUpperCase()+s.slice(1)}
function mkN(o){const n={id:S.npcs.length+1,name:o.name||nm(),sex:o.sex,x:o.x,y:o.y,born:o.born,age:0,hp:1,hunger:.8,thirst:.8,energy:.9,warm:.6,pers:o.p,vig:o.vig,fert:o.fert,life:(40+35*o.vig)*YEAR,skills:{for:0,hunt:0,craft:0,build:0},know:{},inv:{b:0,m:0,w:0,s:0,h:0,sp:0},mem:{},rel:{},mother:o.mother||0,father:o.father||0,kids:[],mate:0,preg:0,pf:0,emo:{fear:0,joy:.3,stress:0},Q:{},act:null,words:0,alive:true,ph:0,cloak:0,hair:o.hair||'#3b2a1a',gen:o.gen||0};S.npcs.push(n);return n}
function newWorld(seed){S={seed,tick:0,rs:seed,clim:0,wx:0,wxT:0,npcs:[],animals:[],struct:[],log:[],disc:{},births:0,deaths:0,aid:1,saved:Date.now()};genWorld();
 let sx=LX-8,sy=LY;for(let a=0;a<360;a+=15){const x=LX+Math.cos(a*.0175)*8,y=LY+Math.sin(a*.0175)*8;if(pass(x,y)&&T[(y|0)*W+(x|0)]==2){sx=x;sy=y;break}}
 const ad=mkN({name:'Adam',sex:'M',x:sx,y:sy,born:-18*YEAR,vig:.75,fert:.8,p:{cur:.7,soc:.6,bold:.6,care:.5},hair:'#2a1c10'}),ev_=mkN({name:'Eve',sex:'F',x:sx+1,y:sy,born:-17*YEAR,vig:.7,fert:.8,p:{cur:.6,soc:.7,bold:.4,care:.7},hair:'#6a3a1a'});
 ad.rel[2]={a:.25,t:.2};ev_.rel[1]={a:.25,t:.2};
 for(let i=0;i<18;i++)spawnA('deer',sx,sy,30);for(let i=0;i<2;i++)spawnA('wolf',sx,sy,0,28);
 ev('world','Adam and Eve awaken in the valley. The tick counter starts at 0; nothing has been discovered.')}
function spawnA(k,cx,cy,rad,minD){for(let j=0;j<40;j++){const x=Math.random()*W,y=Math.random()*H;const px=rad?cx+(R()-.5)*rad*2:W*R(),py=rad?cy+(R()-.5)*rad*2:H*R();if(pass(px,py)&&(!minD||Math.hypot(px-cx,py-cy)>minD)){S.animals.push({id:S.aid++,k,x:px,y:py,st:1,hu:.7,hp:1,h:R()*6.28,ph:0});return true}}return false}
function ev(k,m){S.log.push({t:S.tick,k,m});if(S.log.length>800)S.log.shift()}
const seas=t=>Math.floor((t%YEAR)/YEAR*4),hour=t=>(t%DAY)/2,isNight=t=>{const h=hour(t);return h<6||h>=18};
const temp=t=>-2+8*Math.cos(6.2832*((t%YEAR)/YEAR-.375))-(isNight(t)?4:0)+S.clim;
const KN=['water','berry','wood','stone'],ck=(k,x,y)=>k*5000+(((y/3)|0)*40+((x/3)|0));
function mk(n,k,x,y,on){const key=ck(k,x,y),e=n.mem[key];if(on)n.mem[key]={k:KN[k],x,y};else if(e&&e.x==x&&e.y==y)delete n.mem[key]}
function look(n){const cx=n.x|0,cy=n.y|0;for(let y=cy-5;y<=cy+5;y++)for(let x=cx-5;x<=cx+5;x++){if(x<0||y<0||x>=W||y>=H)continue;const i=y*W+x;mk(n,0,x,y,T[i]<2);mk(n,1,x,y,BR[i]>0);mk(n,2,x,y,WD[i]>0);mk(n,3,x,y,ST[i]>0)}
 const ks=Object.keys(n.mem);if(ks.length>90)for(let j=0;j<ks.length-90;j++)delete n.mem[ks[j]]}
function best(n,k){let b=null,bd=1e9;for(const key in n.mem){const e=n.mem[key];if(e.k!=k)continue;const d=Math.hypot(e.x-n.x,e.y-n.y)+R()*2;if(d<bd){bd=d;b=e}}return b}
function nearS(n,t,r){let b=null,bd=r;for(const s of S.struct)if(s.t==t){const d=Math.hypot(s.x-n.x,s.y-n.y);if(d<bd){bd=d;b=s}}return b}
function nearA(n,k,r){let b=null,bd=r;for(const a of S.animals)if(a.k==k){const d=Math.hypot(a.x-n.x,a.y-n.y);if(d<bd){bd=d;b=a}}return b}
function mv(n,tx,ty,sp){const dx=tx-n.x,dy=ty-n.y,l=Math.hypot(dx,dy);if(l<.05)return;const s=Math.min(sp,l),ux=dx/l*s,uy=dy/l*s;
 if(pass(n.x+ux,n.y+uy)){n.x+=ux;n.y+=uy}else if(pass(n.x+ux,n.y)){n.x+=ux}else if(pass(n.x,n.y+uy)){n.y+=uy}else{const g=R()*6.28,sx=n.x+Math.cos(g)*sp,sy=n.y+Math.sin(g)*sp;if(pass(sx,sy)){n.x=sx;n.y=sy}}n.ph+=s*3;n.fx=ux}
function go(n,tx,ty,r,sp){if(Math.hypot(tx-n.x,ty-n.y)>r){mv(n,tx,ty,sp||.5);return false}return true}
const npc=id=>S.npcs[id-1],kin=(a,b)=>a.id==b.mother||a.id==b.father||b.id==a.mother||b.id==a.father||(a.mother&&a.mother==b.mother)||(a.father&&a.father==b.father);
function learn(n,k,d){n.know[k]=1;if(!S.disc[k]){S.disc[k]={by:n.id,name:n.name,t:S.tick,desc:d};ev('discovery',n.name+' discovered '+d)}}
function fin(n,r){const a=n.act;if(a){n.Q[a.a]=(n.Q[a.a]||1)+.1*(r-(n.Q[a.a]||1));if(r>1.5)n.emo.joy=Math.min(1,n.emo.joy+.2)}n.act=null}
function bond(a,b,d){const r=a.rel[b.id]||(a.rel[b.id]={a:0,t:0});r.a=Math.min(1,r.a+d);r.t=Math.min(1,r.t+d*.5)}
function teach(n,o){for(const k in n.know)if(!o.know[k]&&R()<.06*(.5+n.pers.soc)*(o.age<14?1.8:1)*(o.pers.cur+.5)){o.know[k]=1;if(k=='spear')o.inv.sp=o.inv.sp||0;ev('teach',n.name+' taught '+o.name+' ('+(S.disc[k]?S.disc[k].desc:k)+')')}
 n.words=Math.min(500,n.words+1);o.words=Math.min(500,o.words+(o.age<8?3:1));if(n.words>=40&&!S.disc.speech){S.disc.speech={by:n.id,name:n.name,t:S.tick,desc:'shared vocabulary (40+ learned sounds in one citizen)'};ev('discovery','Shared vocabulary emerged around '+n.name)}}
function tryExp(n){const i=n.inv,c=.6+n.pers.cur;n.skills.craft=Math.min(1,n.skills.craft+.002);let r=.3;
 if(i.s>=2&&!n.know.stone_tool){if(R()<.05*c){learn(n,'stone_tool','striking stones into sharp flakes');r=2.5}}
 else if(n.know.stone_tool&&i.s&&i.w&&!n.know.spear){if(R()<.06*c){learn(n,'spear','binding a flake to a wooden shaft (spear)');i.sp=1;i.s--;i.w--;r=2.5}}
 else if(n.know.stone_tool&&i.s&&i.w&&!n.know.fire){if(R()<.006*c*(1+3*(1-n.warm))){learn(n,'fire','making fire from struck sparks');r=3}}
 else if(i.w>=3&&!n.know.shelter){if(R()<.03*c){learn(n,'shelter','leaning branches into a shelter');r=2.5}}
 else if(n.know.fire&&i.m&&!n.know.cook&&nearS(n,'fire',4)){if(R()<.12){learn(n,'cook','cooking meat over fire');r=2.5}}
 else if(i.h&&n.know.stone_tool&&!n.know.cloak){if(R()<.06*c){learn(n,'cloak','sewing hides into a cloak');i.h--;n.cloak=1;r=2.5}}
 else if(i.w&&i.s&&n.know.stone_tool&&!n.know.axe){if(R()<.04*c){learn(n,'axe','hafting a stone axe');r=2.2}}
 return r}
function plan(n){const A=n.age>=14,night=isNight(S.tick),sc={},nv=Math.min(n.hunger,n.thirst);
 if(n.danger&&S.tick-n.danger.t<12){n.act={a:'flee',t:12};return}
 const mw=best(n,'water'),mb=best(n,'berry'),mwd=best(n,'wood'),mst=best(n,'stone'),food=n.inv.b+n.inv.m,fire=nearS(n,'fire',14);
 sc.drink=mw?3*Math.pow(1-n.thirst,1.5):0;sc.eat=food?3.2*Math.pow(1-n.hunger,1.5):0;
 sc.forage=mb?(food<3?2.4:.3)*Math.pow(1-n.hunger,1.2)+.1:0;
 const dr=A?nearA(n,'deer',12):null;if(dr)sc.hunt=(.15+.9*(1-n.hunger))*(.4+n.pers.bold)*(n.inv.m<2?1:.2)*(1+(n.inv.sp?.5:0));
 sc.wood=mwd&&n.inv.w<8?.2+.5*n.pers.cur+((n.know.fire||n.know.shelter)?.5:0):0;sc.stone=mst&&n.inv.s<4?.15+.4*n.pers.cur+(n.know.stone_tool?.3:0):0;
 sc.rest=2.6*Math.pow(1-n.energy,2)+(night?.8*(1-n.energy):0);
 sc.experiment=n.age>=8&&(n.inv.s||n.inv.w)?n.pers.cur*1.1*(nv>.45?1:.2):0;
 if(n.know.shelter&&n.inv.w>=6&&!nearS(n,'shelter',12))sc.build=.4+1.3*(1-n.warm)+(night?.4:0);
 if(n.know.fire&&n.inv.w>=2&&!nearS(n,'fire',8)&&(n.warm<.55||night))sc.fire=.5+1.6*(1-n.warm);
 if(fire&&fire.ttl<80&&n.inv.w>0)sc.fire=1.2;
 let oth=null,od=25;for(const o of S.npcs)if(o.alive&&o!==n){const d=Math.hypot(o.x-n.x,o.y-n.y);if(d<od){od=d;oth=o}}
 if(oth)sc.social=.15+.7*n.pers.soc+(od>6?.2:0);
 let ch=null;if(food)for(const o of S.npcs)if(o.alive&&o.age<6&&o.hunger<.55&&Math.hypot(o.x-n.x,o.y-n.y)<12&&(o.mother==n.id||o.father==n.id||n.pers.care>.6)){ch=o;break}
 if(ch)sc.feed=2.6;
 let pm=null;if(A&&nv>.4&&n.energy>.3&&!(n.sex=='F'&&(n.preg||n.age>42))&&S.npcs.length<400){let bs=-1;for(const o of S.npcs)if(o.alive&&o.sex!=n.sex&&o.age>=14&&!kin(n,o)&&!(o.sex=='F'&&(o.preg||o.age>42))){const d=Math.hypot(o.x-n.x,o.y-n.y);if(d<25){const s=(n.rel[o.id]?n.rel[o.id].a:0)+(n.mate==o.id?1:0)-d*.01;if(s>bs){bs=s;pm=o}}}
  if(pm&&(n.rel[pm.id]?n.rel[pm.id].a:0)>=.2)sc.mate=.4+1.4*n.pers.soc;else pm=null}
 sc.explore=.1+.45*n.pers.cur+(mw?0:2.6*Math.pow(1-n.thirst,1.3))+(!mb&&!food?2*(1-n.hunger):0);
 let bk='explore',bv=-1;for(const k in sc){let v=sc[k];if(k!='drink'&&k!='eat'&&k!='rest')v*=Math.max(.4,Math.min(2,n.Q[k]||1));v+=R()*.35;if(v>bv){bv=v;bk=k}}
 const a={a:bk,t:70,tx:n.x,ty:n.y};
 if(bk=='drink'){a.tx=mw.x;a.ty=mw.y}else if(bk=='forage'){a.tx=mb.x;a.ty=mb.y}else if(bk=='wood'){a.tx=mwd.x;a.ty=mwd.y}else if(bk=='stone'){a.tx=mst.x;a.ty=mst.y}
 else if(bk=='hunt')a.ref=dr.id;else if(bk=='social')a.ref=oth.id;else if(bk=='mate')a.ref=pm.id;else if(bk=='feed')a.ref=ch.id;
 else if(bk=='eat')a.t=30;else if(bk=='experiment')a.t=6;else if(bk=='build')a.t=18;
 else if(bk=='rest'){a.t=60;const sh=nearS(n,'shelter',15);if(sh){a.tx=sh.x;a.ty=sh.y}}
 else if(bk=='fire'){a.t=30;if(fire&&fire.ttl<80)a.ref=fire}
 else if(bk=='explore'){a.n0=Object.keys(n.mem).length;for(let j=0;j<5;j++){const g=R()*6.28,d=6+14*R()*(.5+n.pers.cur),x=n.x+Math.cos(g)*d,y=n.y+Math.sin(g)*d;if(pass(x,y)){a.tx=x;a.ty=y;break}}}
 n.act=a}
function exec(n){const a=n.act,o=a.ref&&typeof a.ref=='number'?npc(a.ref):null;if(--a.t<=0&&a.a!='experiment'&&a.a!='build'&&a.a!='eat'&&a.a!='fire'){if(a.a=='rest')fin(n,.8);else fin(n,.1);return}
 switch(a.a){
 case'flee':{const w=n.danger;if(w){const dx=n.x-w.x,dy=n.y-w.y,l=Math.hypot(dx,dy)||1;mv(n,n.x+dx/l*3,n.y+dy/l*3,.5)}if(a.t<=1)fin(n,.2);break}
 case'rest':if(go(n,a.tx,a.ty,1.5)){n.energy=Math.min(1,n.energy+.03);if(n.energy>.95)fin(n,1)}break;
 case'drink':if(go(n,a.tx,a.ty,1.6)){n.thirst=Math.min(1,n.thirst+.5);fin(n,1.3)}break;
 case'eat':{if(!n.inv.b&&n.inv.m&&n.know.cook){const f=nearS(n,'fire',14);if(f&&Math.hypot(f.x-n.x,f.y-n.y)>2.5&&a.t>0){mv(n,f.x,f.y,.5);return}}
  let g=0;if(n.inv.b>0){n.inv.b--;g=.22}else if(n.inv.m>0){n.inv.m--;if(n.know.cook&&nearS(n,'fire',3.5))g=.7;else{g=.45;if(R()<.12){n.hp-=.1;n.emo.stress+=.2}}}n.hunger=Math.min(1,n.hunger+g);fin(n,g*4);break}
 case'forage':case'wood':case'stone':{if(!go(n,a.tx,a.ty,1.1))break;const i=(a.tx|0)+(a.ty|0)*W,L=a.a=='forage'?BR:a.a=='wood'?WD:ST,it=a.a=='forage'?'b':a.a=='wood'?'w':'s';
  if(L[i]>0){L[i]--;n.inv[it]++;a.n=(a.n||0)+1;if(a.a=='forage')n.skills.for=Math.min(1,n.skills.for+.003);if(a.n>=3)fin(n,.5+a.n*.5)}else{delete n.mem[ck(a.a=='forage'?1:a.a=='wood'?2:3,a.tx,a.ty)];fin(n,a.n?.5+a.n*.5:.1)}break}

 return '<div class="r"><h3>'+n.name+(n.sex=='M'?' ♂':' ♀')+(n.alive?'':' †')+'</h3><p>Age '+n.age.toFixed(1)+'y of ~'+(n.life/YEAR|0)+' · gen '+n.gen+' · '+(n.alive?'<b>'+(n.age<6?'dependent child':ACTL[n.act&&n.act.a]||'deciding')+'</b>':'died '+dstr(n.died.t)+': '+n.died.c)+'</p>'+
 '<p>'+bar(n.hp,'#4c4')+'health '+bar(n.hunger,'#c93')+'food '+bar(n.thirst,'#39c')+'water '+bar(n.energy,'#99c')+'energy '+bar(n.warm,'#e66')+'warmth</p>'+
 '<p class="m">Curiosity '+n.pers.cur.toFixed(2)+' · Social '+n.pers.soc.toFixed(2)+' · Bold '+n.pers.bold.toFixed(2)+' · Caring '+n.pers.care.toFixed(2)+' · Vigour '+n.vig.toFixed(2)+'</p>'+
 '<p>Skills: forage '+n.skills.for.toFixed(2)+', hunt '+n.skills.hunt.toFixed(2)+', craft '+n.skills.craft.toFixed(2)+', build '+n.skills.build.toFixed(2)+'</p><p>Knows: '+(kn.length?kn.map(k=>'<span class="k">'+k+'</span>').join(''):'<span class="m">nothing special yet</span>')+'</p>'+
 '<p>Carrying: berries '+n.inv.b+', meat '+n.inv.m+', wood '+n.inv.w+', stone '+n.inv.s+', hides '+n.inv.h+(n.inv.sp?', spear':'')+'</p><p>Memory: '+Object.keys(n.mem).length+' places · words '+n.words+' · fear '+n.emo.fear.toFixed(2)+' joy '+n.emo.joy.toFixed(2)+' stress '+n.emo.stress.toFixed(2)+'</p>'+
 '<p>Bonds: '+rl+'</p><p>Parents: '+(n.mother?npc(n.mother).name+' & '+npc(n.father).name:'founder')+' · children '+n.kids.length+(n.preg?' · pregnant':'')+'</p><p class="m">Learned action values: '+q+'</p>'+
 (n.alive?'<button data-a="follow" class="'+(follow?'on':'')+'">Follow</button> <button data-a="pov" class="'+(pov?'on':'')+'">See through their eyes</button>':'')+'</div>'}
function tree(n,d){let s='<div style="margin-left:'+d*14+'px" data-sel="'+n.id+'">'+(d?'└ ':'')+n.name+(n.sex=='M'?'♂':'♀')+' '+(n.alive?n.age.toFixed(0)+'y':'†')+(n.mate?' ⚭ '+npc(n.mate).name:'')+'</div>';for(const k of n.kids){const c=npc(k);if(c.mother==n.id)s+=tree(c,d+1)}return s}
function panel(){const t=S.tick,al=S.npcs.filter(n=>n.alive);let h='';
 if(tab=='ov'){const dr=S.animals.filter(a=>a.k=='deer').length,wf=S.animals.length-dr,st=settlements();
  h='<h3>'+dstr(t)+', '+(hour(t)|0)+':00 · '+SN[seas(t)]+'</h3><p>'+temp(t).toFixed(1)+'°C (creator offset '+(S.clim>0?'+':'')+S.clim+') · '+(S.wx?(temp(t)>0?'rain':S.wx==2?'blizzard':'snow'):'clear')+'</p>'+
  '<p><b>Population '+al.length+'</b> (men '+al.filter(n=>n.sex=='M'&&n.age>=14).length+', women '+al.filter(n=>n.sex=='F'&&n.age>=14).length+', children '+al.filter(n=>n.age<14).length+') · born '+S.births+' · died '+S.deaths+'</p>'+
  '<p>Wildlife: deer '+dr+', wolves '+wf+'</p><p>Resources: berries '+sum(BR)+', timber '+sum(WD)+', stone '+sum(ST)+'</p><p>Fires '+S.struct.filter(s=>s.t=='fire').length+' · shelters '+S.struct.filter(s=>s.t=='shelter').length+' · settlements '+st.length+(st.length?' at '+st.map(q=>'('+(q.x|0)+','+(q.y|0)+')').join(' '):'')+'</p>'+
  '<p>Discoveries '+Object.keys(S.disc).length+' · generation max '+Math.max(...S.npcs.map(n=>n.gen))+'</p><h3>Creator tools</h3><p><button data-a="cm">Colder</button> <button data-a="cp">Warmer</button> <button data-a="sb">Seed berries</button> <button data-a="sd">Add deer</button> <button data-a="sw">Add timber</button> <button data-a="bl">Blight area</button></p><p><button data-a="rst">'+(armed?'Tap again to erase world':'Reset world')+'</button> <button data-a="sv">Save now</button></p><p class="m">Tools act around the map centre of your view. Every use is written to History.</p>'}
 else if(tab=='ci'){h=(sel?insp(npc(sel)):'<p class="m">Tap a citizen on the map or below.</p>')+al.map(n=>'<div class="r" data-sel="'+n.id+'">'+n.name+(n.sex=='M'?' ♂ ':' ♀ ')+n.age.toFixed(0)+'y <span class="m">'+(n.age<6?'child':ACTL[n.act&&n.act.a]||'…')+'</span></div>').join('')}
 else if(tab=='hi')h=S.log.slice(-80).reverse().map(e=>'<div class="r"><span class="m">'+dstr(e.t)+'</span> '+e.m+'</div>').join('');
 else if(tab=='di'){const ks=Object.keys(S.disc);h=ks.length?ks.map(k=>{const d=S.disc[k];return '<div class="r"><b>'+k+'</b>: '+d.desc+'<br><span class="m">first by '+d.name+', '+dstr(d.t)+' · known by '+al.filter(n=>n.know[k]||(k=='speech'&&n.words>=40)).length+' living</span></div>'}).join(''):'<p class="m">No discoveries yet. Citizens must experiment to find them.</p>'}
 else h='<p class="m">Descendants by mother line. Tap a name to inspect.</p>'+tree(npc(2),0)+'<div class="m" style="margin-top:6px">Adam ⚭ Eve (father line shown in inspector)</div>';
 return h}
let pTab='',pSel=-1,region={x:Math.floor(W/2),y:Math.floor(H/2)};
function biomeName(x,y){const i=Math.max(0,Math.min(W*H-1,(y|0)*W+(x|0))),v=T[i];return v<1?'Deep water':v==1?'River / shore':v==2?'Grassland':v==3?'Forest':v==4?'Rocky highland':'Snow / mountain'}
function regionPanel(){const x=Math.max(0,Math.min(W-1,region.x|0)),y=Math.max(0,Math.min(H-1,region.y|0)),i=y*W+x,rad=5;let berries=0,wood=0,stone=0,people=0,animalsHere=0,buildings=0;
 for(let yy=Math.max(0,y-rad);yy<=Math.min(H-1,y+rad);yy++)for(let xx=Math.max(0,x-rad);xx<=Math.min(W-1,x+rad);xx++){const j=yy*W+xx;berries+=BR[j];wood+=WD[j];stone+=ST[j]}
 for(const n of S.npcs)if(n.alive&&Math.hypot(n.x-x,n.y-y)<=rad)people++;
 for(const a of S.animals)if(Math.hypot(a.x-x,a.y-y)<=rad)animalsHere++;
 for(const s of S.struct)if(Math.hypot(s.x-x,s.y-y)<=rad)buildings++;
 return '<h3>REGION EXPLORER</h3><p><b>'+biomeName(x,y)+'</b> · coordinates '+x+', '+y+'</p><p class="m">You opened this part of Planet Veyra. The figures below describe the surrounding 11 × 11 area.</p><div class="r">🌿 Berries: <b>'+berries+'</b> · 🌲 Timber: <b>'+wood+'</b> · 🪨 Stone: <b>'+stone+'</b></div><div class="r">👥 Living citizens nearby: <b>'+people+'</b> · 🦌 Wildlife nearby: <b>'+animalsHere+'</b></div><div class="r">🏕️ Structures nearby: <b>'+buildings+'</b></div><p><button data-a="regioncenter">FOCUS THIS REGION</button> <button data-a="regionclose">BACK TO WORLD</button></p><p class="m">Tap another place on the map to inspect a different region. Zoom in to explore details.</p>'}
function ui(){const p=$('pan'),y=p.scrollTop;p.innerHTML=panel();p.scrollTop=y;const t=S.tick;$('clock').textContent=dstr(t)+' '+String(hour(t)|0).padStart(2,'0')+':00 · '+SN[seas(t)]+' · pop '+S.npcs.filter(n=>n.alive).length+(pov?' · VIEWING '+npc(sel).name+' (autonomy intact)':'')}
function build(){$('tabs').innerHTML=[['ov','🌍 WORLD'],['rg','🗺 REGIONS'],['ci','👥 CITIZENS'],['hi','📜 HISTORY'],['di','💡 DISCOVERIES'],['fa','🌳 FAMILY']].map(a=>'<button data-t="'+a[0]+'" class="'+(tab==a[0]&&!coll?'on':'')+'">'+a[1]+'</button>').join('');
 $('spd').innerHTML=['⏸','1×','10×','100×','500×'].map((l,i)=>'<button data-s="'+i+'" class="'+(spd==i?'on':'')+'">'+l+'</button>').join('')}
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;if(t==tab)coll=!coll;else{tab=t;coll=false}$('sheet').className=coll?'c':'';build();ui()};
$('spd').onclick=e=>{const s=e.target.dataset.s;if(s!==undefined){spd=+s;build()}};
$('pan').onclick=e=>{const el=e.target.closest('[data-sel],[data-a]');if(!el)return;if(el.dataset.sel){sel=+el.dataset.sel;tab='ci';build();ui();return}const a=el.dataset.a,cxx=cam.x,cyy=cam.y;
 if(a=='follow')follow=!follow;else if(a=='pov'){pov=!pov;if(pov){follow=true;cam.z=Math.max(cam.z,20)}}
 else if(a=='cm'||a=='cp'){S.clim+=a=='cm'?-2:2;ev('creator','Creator shifted climate offset to '+S.clim+'°C')}
 else if(a=='sv')save();else if(a=='rst'){if(!armed){armed=true;setTimeout(()=>{armed=false;ui()},4000)}else{newWorld(Date.now()%100000+7);buildTerrain();sel=0;pov=follow=false;armed=false;save()}}
 else{let c=0;for(let i=0;i<60;i++){const x=(cxx+(Math.random()-.5)*14)|0,y=(cyy+(Math.random()-.5)*14)|0;if(x<0||y<0||x>=W||y>=H)continue;const j=y*W+x,ty=T[j];
  if(a=='sb'&&(ty==2||ty==3)&&c<20){BF[j]=1;BR[j]=3;c++}else if(a=='sw'&&ty==3&&c<25){WD[j]=8;c++}else if(a=='bl'&&ty>=2){BR[j]=0;BF[j]=0;c++}}
  if(a=='sd'){for(let i=0;i<5;i++)spawnA('deer',cxx,cyy,6);c=5}ev('creator','Creator used '+({sb:'seed berries',sw:'add timber',bl:'blight',sd:'add deer'})[a]+' ('+c+' affected) near ('+(cxx|0)+','+(cyy|0)+')')}ui();build()};
let ptr={},moved=0,pd=0;cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr[e.pointerId]=[e.clientX,e.clientY];moved=0;pd=0};
cv.onpointermove=e=>{const p=ptr[e.pointerId];if(!p)return;const ids=Object.keys(ptr);if(ids.length==2){const o=ptr[ids.find(i=>i!=e.pointerId)],d0=Math.hypot(p[0]-o[0],p[1]-o[1]);p[0]=e.clientX;p[1]=e.clientY;const d1=Math.hypot(p[0]-o[0],p[1]-o[1]);cam.z=Math.max(3,Math.min(48,cam.z*d1/d0));moved=99}else{const dx=e.clientX-p[0],dy=e.clientY-p[1];moved+=Math.abs(dx)+Math.abs(dy);p[0]=e.clientX;p[1]=e.clientY;if(moved>6){cam.x-=dx/cam.z;cam.y-=dy/cam.z;follow=false}}};
cv.onpointerup=e=>{if(moved<6){const wx=(e.clientX-cw/2)/cam.z+cam.x,wy=(e.clientY-ch/2)/cam.z+cam.y;let b=0,bd=Math.max(.8,Math.min(2.2,18/cam.z));for(const n of S.npcs)if(n.alive){const d=Math.hypot(n.x-wx,n.y-wy);if(d<bd){bd=d;b=n.id}}if(b){sel=b;tab='ci'}else{region={x:Math.max(0,Math.min(W-1,Math.floor(wx))),y:Math.max(0,Math.min(H-1,Math.floor(wy)))};tab='rg'}coll=false;$('sheet').className='';build();ui()}delete ptr[e.pointerId]};
cv.onpointercancel=e=>{delete ptr[e.pointerId]};cv.onwheel=e=>{e.preventDefault();cam.z=Math.max(1.5,Math.min(80,cam.z*(e.deltaY<0?1.12:.89)))};
addEventListener('resize',rs);document.addEventListener('visibilitychange',()=>document.hidden?save():catchup());
/* ============ BOOT ============ */
if(!load())newWorld(1337);else catchup();buildTerrain();rs();
 {const a=S.npcs.find(n=>n.alive);if(a){cam.x=a.x;cam.y=a.y;cam.z=14}}build();ui();
let last=performance.now(),acc=0,lu=0,ls=0;
function frame(now){const dt=Math.min(.25,(now-last)/1000);last=now;acc+=dt*SP[spd];const t0=performance.now();let k=0;while(acc>=1){tick();acc--;if(++k%8==0&&performance.now()-t0>12)break}if(acc>SP[spd]*.2)acc=0;
 if(follow&&sel&&npc(sel).alive){const n=npc(sel);cam.x+=(n.x-cam.x)*.15;cam.y+=(n.y-cam.y)*.15}else if(pov&&(!sel||!npc(sel).alive)){pov=false;follow=false}
 draw();if(now-lu>500){lu=now;ui()}if(now-ls>5000){ls=now;save()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
